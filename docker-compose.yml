
services:
  postgres:
    image: postgres:16
    container_name: skynet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skynet
      POSTGRES_USER: skynet_user
      POSTGRES_PASSWORD: skynet_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skynet_user -d skynet"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
